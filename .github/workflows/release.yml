name: Release Windows

# Manual trigger only. No push/PR triggers — source code lives on GitLab,
# not here, so "push to main" is never a meaningful event in this repo.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        type: choice
        options:
          - patch
          - minor
        default: patch
        required: true

# Only repo collaborators can run workflow_dispatch, so no extra permission
# guards needed. If you ever add PR triggers, require approval for outside
# collaborators in Settings → Actions → General.

jobs:
  release-windows:
    name: "Release Windows (${{ inputs.bump }})"
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}
      GITLAB_DEPLOY_TOKEN_USERNAME: ${{ secrets.GITLAB_DEPLOY_TOKEN_USERNAME }}
      GITLAB_DEPLOY_TOKEN_PASSWORD: ${{ secrets.GITLAB_DEPLOY_TOKEN_PASSWORD }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}

    steps:
      - name: Clone source from GitLab
        shell: bash
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::GITLAB_TOKEN secret is missing — cannot clone source"
            exit 1
          fi
          git clone \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/smoozy-ai/windows.git" \
            source
          cd source
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Cloned $(git rev-parse --short HEAD) from GitLab"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri
          # Stable key independent of Cargo.lock hash. Without this, each
          # release bumps the version in Cargo.lock → new hash → cache miss
          # → all crates re-fetched + recompiled (~15 min). With shared-key,
          # the cache survives version bumps and only invalidates on real
          # dependency changes.
          shared-key: smoozy-windows-rust
          cache-on-failure: true
          cache-all-crates: true

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build & release
        working-directory: source
        shell: bash
        run: |
          BUMP_FLAG=""
          if [ "${{ inputs.bump }}" = "patch" ]; then
            BUMP_FLAG="--patch"
          fi
          node scripts/bump-release.mjs $BUMP_FLAG --no-password

      - name: Commit and push version bump to GitLab
        if: success()
        working-directory: source
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          git commit -m "chore: release $VERSION"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt — rebasing on origin/main"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Unexpected rebase conflict on version bump — aborting"
              exit 1
            fi
          done
          echo "::error::Failed to push version bump after 5 attempts"
          exit 1

      - name: Upload artifacts (debug copy, 14-day retention)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoozy-windows-${{ inputs.bump }}
          path: |
            source/src-tauri/target/release/bundle/nsis/*.exe
            source/src-tauri/target/release/bundle/nsis/*.exe.sig
          retention-days: 14
          if-no-files-found: warn
