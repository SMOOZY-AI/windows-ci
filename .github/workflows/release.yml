name: Release Windows

# Manual trigger only. No push/PR triggers — source code lives on GitLab,
# not here, so "push to main" is never a meaningful event in this repo.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        type: choice
        options:
          - patch
          - minor
        default: patch
        required: true
      # Publishing the manifest is the single act that pushes a build at every
      # installed client at once, and it cannot be taken back from anyone who
      # applies it before a rollback. Defaulting it OFF makes that a deliberate
      # choice instead of a side effect of cutting a release.
      #
      # It has to be a choice you can withhold: on 2026-08-06 a Job Object flag
      # shipped in 3.131.2/3.131.3 made those clients kill their own update
      # installer, so an ordinary release run would have re-bricked 26+ users
      # recoverable only by hand. Artifacts and the downloads page are published
      # either way — new installs always get the fix.
      # See backend/docs/release-ops/2026-08-06-windows-autoupdate-job-object-incident.md
      publish_manifest:
        description: "Push this build at existing clients (publish the auto-update manifest)"
        type: boolean
        default: false
        required: true
      # Which build to ship (W2, epic west-market-product). `ru` is the release
      # as it has always run. `west` re-builds the LAST Russian release commit
      # (`chore: release <version>` on main) as the west build: own update
      # channel, own updater key (TAURI_SIGNING_PRIVATE_KEY_WEST /
      # TAURI_SIGNING_PRIVATE_KEY_PASSWORD_WEST secrets), own GitLab package and
      # downloads record — see source/scripts/release-flavors.mjs. It never bumps
      # the version and never pushes; `bump` is ignored for it. Run it after the
      # Russian release of the same version.
      flavor:
        description: "Build flavor: ru (bump + release) or west (re-build the last ru release as the west build)"
        type: choice
        options:
          - ru
          - west
        default: ru
        required: true

# Releases run one at a time: two runs on the same version would race on the
# version bump, the GitLab package and the update manifest.
concurrency:
  group: release-windows
  cancel-in-progress: false

# Only repo collaborators can run workflow_dispatch, so no extra permission
# guards needed. If you ever add PR triggers, require approval for outside
# collaborators in Settings → Actions → General.

jobs:
  release-windows:
    name: "Release Windows (${{ inputs.flavor }}, ${{ inputs.bump }})"
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}
      GITLAB_DEPLOY_TOKEN_USERNAME: ${{ secrets.GITLAB_DEPLOY_TOKEN_USERNAME }}
      GITLAB_DEPLOY_TOKEN_PASSWORD: ${{ secrets.GITLAB_DEPLOY_TOKEN_PASSWORD }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}

    steps:
      - name: Clone source from GitLab
        shell: bash
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::GITLAB_TOKEN secret is missing — cannot clone source"
            exit 1
          fi
          git clone \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/smoozy-ai/windows.git" \
            source
          cd source
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Cloned $(git rev-parse --short HEAD) from GitLab"

      # The west build is the Russian release of the current version, re-built:
      # same commit, so both channels ship the same code under the same number.
      - name: Check out the last release commit (west)
        if: inputs.flavor == 'west'
        working-directory: source
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # awk reads to the end on purpose: an early `exit` closes the pipe while
          # git log is still writing, git dies of SIGPIPE, and under the runner's
          # `bash -e -o pipefail` that 141 fails the step (first west runs, 24.10).
          SHA=$(git log --format='%H%x09%s' | awk -F'\t' -v s="chore: release $VERSION" '$2 == s && !found { print $1; found = 1 }')
          if [ -z "$SHA" ]; then
            echo "::error::No 'chore: release $VERSION' commit on main — run the ru release first"
            exit 1
          fi
          git checkout --detach "$SHA"
          # A release cut before W2 has a release.mjs that silently ignores
          # --flavor: it would do a RUSSIAN release (Russian package, manifest and
          # downloads record) signed with the west key. Refuse it outright.
          if [ ! -f scripts/release-flavors.mjs ] || ! grep -q "release-flavors.mjs" scripts/release.mjs; then
            echo "::error::Release $VERSION predates the west build (no scripts/release-flavors.mjs) — cut a ru release with W2 first"
            exit 1
          fi
          echo "::notice::West build of $VERSION from $(git rev-parse --short HEAD)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri
          # Stable key independent of Cargo.lock hash. Without this, each
          # release bumps the version in Cargo.lock → new hash → cache miss
          # → all crates re-fetched + recompiled (~15 min). With shared-key,
          # the cache survives version bumps and only invalidates on real
          # dependency changes.
          shared-key: smoozy-windows-rust
          cache-on-failure: true
          cache-all-crates: true

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build & release
        if: inputs.flavor == 'ru'
        working-directory: source
        shell: bash
        run: |
          BUMP_FLAG=""
          if [ "${{ inputs.bump }}" = "patch" ]; then
            BUMP_FLAG="--patch"
          fi
          # Withhold by default; only an explicit tick publishes the manifest.
          MANIFEST_FLAG="--no-manifest"
          if [ "${{ inputs.publish_manifest }}" = "true" ]; then
            MANIFEST_FLAG=""
            echo "::warning::Auto-update manifest WILL be published — every installed client updates to this build."
          else
            echo "::notice::Auto-update manifest withheld (--no-manifest). Artifacts and the downloads page still ship."
          fi
          node scripts/bump-release.mjs $BUMP_FLAG --no-password $MANIFEST_FLAG

      # No --no-password here, ever: it would sign with the Russian key baked into
      # release.mjs (the script refuses it for west anyway). A missing secret
      # stops the run in preflight, before anything is built or uploaded.
      - name: Build & release (west)
        if: inputs.flavor == 'west'
        working-directory: source
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_WEST }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_WEST }}
        run: |
          MANIFEST_FLAG="--no-manifest"
          if [ "${{ inputs.publish_manifest }}" = "true" ]; then
            MANIFEST_FLAG=""
            echo "::warning::West auto-update manifest WILL be published — every installed west client updates to this build."
          else
            echo "::notice::West auto-update manifest withheld (--no-manifest). Artifacts and the west downloads record still ship."
          fi
          node scripts/release.mjs --flavor west $MANIFEST_FLAG

      - name: Commit and push version bump to GitLab
        if: success() && inputs.flavor == 'ru'
        working-directory: source
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          git commit -m "chore: release $VERSION"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt — rebasing on origin/main"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Unexpected rebase conflict on version bump — aborting"
              exit 1
            fi
          done
          echo "::error::Failed to push version bump after 5 attempts"
          exit 1

      - name: Upload artifacts (debug copy, 14-day retention)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoozy-windows-${{ inputs.flavor }}-${{ inputs.bump }}
          path: |
            source/src-tauri/target/release/bundle/nsis/*.exe
            source/src-tauri/target/release/bundle/nsis/*.exe.sig
          retention-days: 14
          if-no-files-found: warn
